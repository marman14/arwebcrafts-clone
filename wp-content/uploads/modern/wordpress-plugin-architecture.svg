<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg-grad-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020f1e"/>
      <stop offset="50%" stop-color="#011B39"/>
      <stop offset="100%" stop-color="#072b54"/>
    </linearGradient>
    <linearGradient id="gold-grad-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D788"/>
      <stop offset="50%" stop-color="#BE8C33"/>
      <stop offset="100%" stop-color="#8a6114"/>
    </linearGradient>
    <pattern id="grid-dots-wp" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#BE8C33" fill-opacity="0.12"/>
    </pattern>
    <filter id="wp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" rx="16" fill="url(#bg-grad-wp)"/>
  <rect width="800" height="533" rx="16" fill="url(#grid-dots-wp)"/>
  <circle cx="480" cy="240" r="180" fill="#BE8C33" fill-opacity="0.07" filter="url(#wp-glow)"/>

  <!-- Top Category Badge -->
  <g transform="translate(44, 34)">
    <rect width="240" height="32" rx="16" fill="#031b38" stroke="#BE8C33" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#BE8C33"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">CUSTOM PLUGIN ARCHITECTURE</text>
  </g>

  <!-- PHP & WordPress Badge Right -->
  <g transform="translate(590, 34)">
    <rect width="166" height="32" rx="16" fill="#07244a" stroke="#255a9b" stroke-width="1"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">PHP 8.2+ &#x2022; Strict Typing</text>
  </g>

  <!-- Main IDE / Code Window (Left-Center) -->
  <g transform="translate(44, 90)">
    <rect width="450" height="380" rx="14" fill="#041427" stroke="#1d487c" stroke-width="1.5"/>
    
    <!-- Code Editor Title Bar -->
    <rect width="450" height="40" rx="14" fill="#020b17"/>
    <circle cx="20" cy="20" r="5" fill="#f87171"/>
    <circle cx="36" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="52" cy="20" r="5" fill="#34d399"/>
    
    <rect x="74" y="8" width="170" height="24" rx="6" fill="#061e38"/>
    <text x="86" y="24" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#cbd5e1">class-ar-engine.php</text>
    <circle cx="228" cy="20" r="3" fill="#BE8C33"/>

    <!-- Code Content Lines with syntax highlighting -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="11.5" xml:space="preserve">
      <!-- Line 1 -->
      <text x="18" y="70" fill="#475569">01</text>
      <text x="48" y="70" fill="#c084fc">namespace</text>
      <text x="120" y="70" fill="#f1f5f9">ARWebcrafts\Engine;</text>

      <!-- Line 2 -->
      <text x="18" y="96" fill="#475569">02</text>
      <text x="48" y="96" fill="#c084fc">final class</text>
      <text x="135" y="96" fill="#F7D788" font-weight="bold">CustomPluginCore</text>
      <text x="260" y="96" fill="#f1f5f9">{</text>

      <!-- Line 3 -->
      <text x="18" y="122" fill="#475569">03</text>
      <text x="68" y="122" fill="#60a5fa">public function</text>
      <text x="175" y="122" fill="#34d399">boot</text>
      <text x="205" y="122" fill="#f1f5f9">(): void {</text>

      <!-- Line 4 -->
      <text x="18" y="148" fill="#475569">04</text>
      <text x="88" y="148" fill="#38bdf8">add_action</text>
      <text x="160" y="148" fill="#f1f5f9">('init', [</text>
      <text x="220" y="148" fill="#c084fc">$this</text>
      <text x="255" y="148" fill="#f1f5f9">, 'register_routes']);</text>

      <!-- Line 5 -->
      <text x="18" y="174" fill="#475569">05</text>
      <text x="88" y="174" fill="#38bdf8">add_filter</text>
      <text x="160" y="174" fill="#f1f5f9">('query_cache', [</text>
      <text x="275" y="174" fill="#c084fc">$this</text>
      <text x="310" y="174" fill="#f1f5f9">, 'optimize']);</text>

      <!-- Line 6 -->
      <text x="18" y="200" fill="#475569">06</text>
      <text x="68" y="200" fill="#f1f5f9">}</text>

      <!-- Line 7 -->
      <text x="18" y="228" fill="#475569">07</text>
      <text x="68" y="228" fill="#60a5fa">public function</text>
      <text x="175" y="228" fill="#34d399">executeHighLoadQuery</text>
      <text x="325" y="228" fill="#f1f5f9">(): array {</text>

      <!-- Line 8 -->
      <text x="18" y="254" fill="#475569">08</text>
      <text x="88" y="254" fill="#64748b">// Zero bloat, indexed SQL execution</text>

      <!-- Line 9 -->
      <text x="18" y="280" fill="#475569">09</text>
      <text x="88" y="280" fill="#c084fc">return</text>
      <text x="140" y="280" fill="#c084fc">$this</text>
      <text x="175" y="280" fill="#f1f5f9">-&gt;cache-&gt;</text>
      <text x="245" y="280" fill="#38bdf8">remember</text>
      <text x="305" y="280" fill="#f1f5f9">('res', 3600);</text>

      <!-- Line 10 -->
      <text x="18" y="306" fill="#475569">10</text>
      <text x="68" y="306" fill="#f1f5f9">}</text>

      <!-- Line 11 -->
      <text x="18" y="332" fill="#475569">11</text>
      <text x="48" y="332" fill="#f1f5f9">}</text>
    </g>

    <!-- Execution Status Bar Bottom -->
    <rect y="348" width="450" height="32" rx="0" fill="#020812"/>
    <circle cx="20" cy="364" r="4" fill="#4ade80"/>
    <text x="32" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#4ade80">Compiled 0 Errors</text>
    <text x="140" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Execution: 4.2ms</text>
    <text x="240" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Memory: 1.8MB</text>
    <text x="340" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#BE8C33">100% PHPUnit</text>
  </g>

  <!-- Right Side Interactive Panels -->
  <!-- Panel 1: WP Admin Hook Manager -->
  <g transform="translate(516, 90)">
    <rect width="240" height="175" rx="12" fill="#04162c" stroke="#255896" stroke-width="1.2"/>
    <rect width="240" height="34" rx="12" fill="#072346"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Hook Lifecycle Manager</text>

    <!-- Hook Item 1 -->
    <g transform="translate(14, 46)">
      <rect width="212" height="34" rx="6" fill="#020d1c"/>
      <circle cx="14" cy="17" r="4" fill="#38bdf8"/>
      <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">plugins_loaded</text>
      <rect x="156" y="8" width="46" height="18" rx="4" fill="#034e35"/>
      <text x="163" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#34d399">READY</text>
    </g>

    <!-- Hook Item 2 -->
    <g transform="translate(14, 88)">
      <rect width="212" height="34" rx="6" fill="#020d1c"/>
      <circle cx="14" cy="17" r="4" fill="#BE8C33"/>
      <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">rest_api_init</text>
      <rect x="150" y="8" width="52" height="18" rx="4" fill="#593b0b"/>
      <text x="157" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#F7D788">ACTIVE</text>
    </g>

    <!-- Hook Item 3 -->
    <g transform="translate(14, 130)">
      <rect width="212" height="34" rx="6" fill="#020d1c"/>
      <circle cx="14" cy="17" r="4" fill="#a855f7"/>
      <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">wp_ajax_custom</text>
      <rect x="146" y="8" width="56" height="18" rx="4" fill="#201a4a"/>
      <text x="152" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#c084fc">SECURE</text>
    </g>
  </g>

  <!-- Panel 2: Performance Benchmark Card -->
  <g transform="translate(516, 285)">
    <rect width="240" height="185" rx="12" fill="#04162c" stroke="#BE8C33" stroke-width="1.2"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Performance Impact</text>
    
    <!-- Comparison metric 1 -->
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Standard Generic Plugins</text>
    <rect x="16" y="60" width="208" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="60" width="168" height="8" rx="4" fill="#f87171"/>
    <text x="190" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#f87171">820ms</text>

    <!-- Comparison metric 2 -->
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#F7D788">AR Webcrafts Custom Plugin</text>
    <rect x="16" y="98" width="208" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="98" width="38" height="8" rx="4" fill="#4ade80"/>
    <text x="190" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#4ade80">18ms</text>

    <!-- Badge at bottom of panel -->
    <rect x="16" y="125" width="208" height="42" rx="8" fill="#0b2447" stroke="#1d487c" stroke-width="1"/>
    <text x="28" y="144" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">&#x2713; Zero Conflicts</text>
    <text x="28" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#F7D788">&#x2713; Tailored Specifically For You</text>
  </g>
</svg>
