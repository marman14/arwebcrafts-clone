      <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Store TTFB &amp; Load Speed</text>
      <text x="18" y="70" font-family="sans-serif" font-size="38" font-weight="800" fill="#4ade80">0.42s</text>
