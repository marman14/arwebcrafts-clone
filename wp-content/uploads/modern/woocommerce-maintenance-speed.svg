      <text x="18" y="132" font-family="sans-serif" font-size="11" fill="#cbd5e1">Last Automated Cloud Backup</text>
      <text x="18" y="152" font-family="monospace" font-size="11" fill="#F2D184">Today, 04:00 AM (AWS S3 Encrypted)</text>
