<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1c"/>
      <stop offset="50%" stop-color="#011B39"/>
      <stop offset="100%" stop-color="#082245"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="50%" stop-color="#BE8C33"/>
      <stop offset="100%" stop-color="#8a6114"/>
    </linearGradient>
    <pattern id="grid-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#BE8C33" fill-opacity="0.12"/>
    </pattern>
    <filter id="svg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="533" rx="16" fill="url(#bg-grad)"/>
  <rect width="800" height="533" rx="16" fill="url(#grid-pattern)"/>
  <circle cx="400" cy="266.5" r="210" fill="#BE8C33" fill-opacity="0.07" filter="url(#svg-glow)"/>

  
  <g transform="translate(44, 34)">
    <rect width="250" height="32" rx="16" fill="#031b38" stroke="#BE8C33" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#BE8C33"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">24/7 ECOMMERCE CARE & SPEED</text>
  </g>

  
  <g transform="translate(560, 34)">
