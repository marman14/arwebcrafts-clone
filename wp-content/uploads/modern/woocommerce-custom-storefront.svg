<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="wc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1c"/>
      <stop offset="50%" stop-color="#011B39"/>
      <stop offset="100%" stop-color="#082245"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="100%" stop-color="#BE8C33"/>
    </linearGradient>
    <pattern id="wc-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#BE8C33" fill-opacity="0.12"/>
    </pattern>
    <filter id="wc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="533" rx="16" fill="url(#wc-bg)"/>
  <rect width="800" height="533" rx="16" fill="url(#wc-grid)"/>
  <circle cx="360" cy="260" r="200" fill="#BE8C33" fill-opacity="0.08" filter="url(#wc-glow)"/>

  <!-- Top Pill -->
  <g transform="translate(44, 34)">
    <rect width="250" height="32" rx="16" fill="#031b38" stroke="#BE8C33" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#BE8C33"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">HIGH-CONVERSION WOOCOMMERCE</text>
  </g>

  <!-- Live Status Right -->
  <g transform="translate(580, 34)">
    <rect width="176" height="32" rx="16" fill="#062244" stroke="#1d487c" stroke-width="1"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Checkout Speed: <tspan fill="#4ade80" font-weight="700">0.38s</tspan></text>
  </g>

  <!-- Storefront Checkout & Cart UI Card (Left) -->
  <g transform="translate(44, 90)">
    <rect width="440" height="390" rx="14" fill="#041427" stroke="#1e4e8a" stroke-width="1.5"/>
    <rect width="440" height="42" rx="14" fill="#030e1d"/>
    <circle cx="20" cy="21" r="5" fill="#f87171"/>
    <circle cx="36" cy="21" r="5" fill="#fbbf24"/>
    <circle cx="52" cy="21" r="5" fill="#34d399"/>
    <text x="74" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#93b9e8">checkout.arwebcrafts-store.io</text>
    
    <!-- 1-Click Checkout Express -->
    <g transform="translate(24, 60)">
      <rect width="392" height="48" rx="8" fill="#0b2447" stroke="#255a9b" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Express Checkout</text>
      <!-- Apple Pay & Stripe Badges -->
      <rect x="220" y="10" width="75" height="28" rx="6" fill="#000000" stroke="#334155" stroke-width="1"/>
      <text x="236" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">&#63743; Pay</text>
      <rect x="305" y="10" width="75" height="28" rx="6" fill="#6366f1"/>
      <text x="323" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Stripe</text>
    </g>

    <!-- Order Item Row 1 -->
    <g transform="translate(24, 124)">
      <rect width="392" height="64" rx="8" fill="#020e1c" stroke="#163866" stroke-width="1"/>
      <rect x="12" y="10" width="44" height="44" rx="6" fill="#0e2a4f"/>
      <circle cx="34" cy="32" r="10" fill="#BE8C33"/>
      <text x="68" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Enterprise WooCommerce Suite</text>
      <text x="68" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Bespoke Checkout + Tiered Pricing</text>
      <text x="325" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#F2D184">$249.00</text>
    </g>

    <!-- Order Item Row 2 (Addon) -->
    <g transform="translate(24, 200)">
      <rect width="392" height="64" rx="8" fill="#020e1c" stroke="#163866" stroke-width="1"/>
      <rect x="12" y="10" width="44" height="44" rx="6" fill="#0e2a4f"/>
      <path d="M28 32 L34 38 L42 26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="68" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Real-Time Inventory &amp; ERP Sync</text>
      <text x="68" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Automated Multi-Warehouse Node</text>
      <text x="333" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#F2D184">$89.00</text>
    </g>

    <!-- Custom Checkout Button -->
    <g transform="translate(24, 280)">
      <rect width="392" height="46" rx="8" fill="url(#gold-accent)"/>
      <text x="196" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#011B39" letter-spacing="0.5">COMPLETE SECURE PURCHASE &rarr;</text>
    </g>

    <!-- Trust Badges Under Button -->
    <g transform="translate(24, 342)">
      <text x="40" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">&#128274; 256-bit SSL Encrypted</text>
      <text x="210" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">&#x26A1; Instant Webhook Delivery</text>
    </g>
  </g>

  <!-- Right Side Analytics & Conversion Metrics -->
  <g transform="translate(506, 90)">
    <!-- Metric 1: Conversion Lift -->
    <rect width="250" height="180" rx="12" fill="#04162c" stroke="#BE8C33" stroke-width="1.2"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Conversion Impact</text>
    
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" fill="#4ade80">+48.6%</text>
    <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Revenue vs standard themes</text>

    <line x1="18" y1="112" x2="232" y2="112" stroke="#163866" stroke-width="1"/>
    
    <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Cart Abandonment Rate</text>
    <rect x="18" y="144" width="214" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="144" width="38" height="6" rx="3" fill="#38bdf8"/>
    <text x="180" y="134" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">14.2% (Low)</text>
  </g>

  <!-- Right Side: Tailored Capabilities Panel -->
  <g transform="translate(506, 290)">
    <rect width="250" height="190" rx="12" fill="#04162c" stroke="#255a9b" stroke-width="1.2"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">WooCommerce Capabilities</text>

    <!-- Checklist items -->
    <g transform="translate(18, 48)">
      <circle cx="8" cy="8" r="6" fill="#BE8C33" fill-opacity="0.2"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#F2D184" stroke-width="1.5"/>
      <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Custom Product Builders</text>
    </g>

    <g transform="translate(18, 80)">
      <circle cx="8" cy="8" r="6" fill="#BE8C33" fill-opacity="0.2"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#F2D184" stroke-width="1.5"/>
      <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Dynamic Tiered Pricing</text>
    </g>

    <g transform="translate(18, 112)">
      <circle cx="8" cy="8" r="6" fill="#BE8C33" fill-opacity="0.2"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#F2D184" stroke-width="1.5"/>
      <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Subscriptions &amp; Memberships</text>
    </g>

    <g transform="translate(18, 144)">
      <circle cx="8" cy="8" r="6" fill="#BE8C33" fill-opacity="0.2"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#F2D184" stroke-width="1.5"/>
      <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Custom Payment Gateways</text>
    </g>
  </g>
</svg>
