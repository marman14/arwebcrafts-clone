<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg-grad-serv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011326"/>
      <stop offset="50%" stop-color="#011B39"/>
      <stop offset="100%" stop-color="#0a254a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="50%" stop-color="#BE8C33"/>
      <stop offset="100%" stop-color="#936717"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#04172f" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#BE8C33" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" rx="16" fill="url(#bg-grad-serv)"/>
  <rect width="800" height="533" rx="16" fill="url(#grid-dots)"/>

  <!-- Subtle glow orb -->
  <circle cx="400" cy="266" r="220" fill="#BE8C33" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Agency Badge -->
  <g transform="translate(40, 36)">
    <rect width="190" height="32" rx="16" fill="#011B39" stroke="#BE8C33" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#BE8C33"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">FULL-STACK SUITE</text>
  </g>

  <!-- Metrics Ribbon Top Right -->
  <g transform="translate(560, 36)">
    <rect width="200" height="32" rx="16" fill="#031b38" stroke="#1c4578" stroke-width="1"/>
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ec5f7">SLA Uptime: <tspan fill="#4ade80" font-weight="700">99.98%</tspan></text>
  </g>

  <!-- Main Central Platform Dashboard Card -->
  <g transform="translate(180, 100)">
    <!-- Card Base -->
    <rect width="440" height="290" rx="16" fill="url(#card-grad)" stroke="#1e4b85" stroke-width="1.5"/>
    <rect width="440" height="42" rx="16" fill="#082040"/>
    
    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5.5" fill="#f87171"/>
    <circle cx="38" cy="21" r="5.5" fill="#fbbf24"/>
    <circle cx="54" cy="21" r="5.5" fill="#34d399"/>

    <!-- Header Title -->
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93b9e8">arwebcrafts-enterprise-core.sys</text>
    <rect x="330" y="12" width="95" height="18" rx="9" fill="#BE8C33" fill-opacity="0.2"/>
    <text x="342" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#F2D184">PRODUCTION</text>

    <!-- Architecture Nodes Inside -->
    <!-- Node 1: WordPress Core -->
    <g transform="translate(24, 64)">
      <rect width="180" height="96" rx="10" fill="#051933" stroke="#255a9b" stroke-width="1"/>
      <circle cx="24" cy="26" r="10" fill="#BE8C33" fill-opacity="0.2"/>
      <path d="M24 20 L27 27 L21 27 Z" fill="#BE8C33"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">WP &amp; Plugin Core</text>
      <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Bespoke Architecture</text>
      <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">High-Load Tested</text>
      <rect x="24" y="80" width="132" height="4" rx="2" fill="#1e293b"/>
      <rect x="24" y="80" width="115" height="4" rx="2" fill="#BE8C33"/>
    </g>

    <!-- Node 2: WooCommerce & SaaS -->
    <g transform="translate(236, 64)">
      <rect width="180" height="96" rx="10" fill="#051933" stroke="#255a9b" stroke-width="1"/>
      <circle cx="24" cy="26" r="10" fill="#38bdf8" fill-opacity="0.2"/>
      <circle cx="24" cy="26" r="4" fill="#38bdf8"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">SaaS &amp; eCommerce</text>
      <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Custom Payment Flows</text>
      <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">REST &amp; Webhooks</text>
      <rect x="24" y="80" width="132" height="4" rx="2" fill="#1e293b"/>
      <rect x="24" y="80" width="128" height="4" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Node 3: Real-Time Performance Graph -->
    <g transform="translate(24, 180)">
      <rect width="392" height="86" rx="10" fill="#041224" stroke="#183c66" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Cluster Throughput &amp; Response Time</text>
      <text x="325" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">32ms TTFB</text>
      <!-- Mini Chart Line -->
      <polyline points="20,68 60,62 100,65 140,50 180,54 220,42 260,46 300,35 340,38 380,30" fill="none" stroke="#BE8C33" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="20,68 60,62 100,65 140,50 180,54 220,42 260,46 300,35 340,38 380,30 380,76 20,76" fill="#BE8C33" fill-opacity="0.12"/>
    </g>
  </g>

  <!-- Left Floating Badge Card: Expert Engineering -->
  <g transform="translate(40, 180)" filter="url(#glow)">
    <rect width="180" height="96" rx="12" fill="#011b39" stroke="#BE8C33" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#BE8C33"/>
    <text x="24" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#011B39">8+</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Years Proven</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#BE8C33">Excellence</text>
    <line x1="20" y1="62" x2="160" y2="62" stroke="#163866" stroke-width="1"/>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#93b9e8">100% Commercial Grade</text>
  </g>

  <!-- Right Floating Badge Card: Dedicated Support -->
  <g transform="translate(580, 240)">
    <rect width="180" height="106" rx="12" fill="#011b39" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="30" cy="32" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="30" cy="32" r="5" fill="#38bdf8"/>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">24/7 Global</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Active Maintenance</text>
    <rect x="20" y="60" width="140" height="32" rx="6" fill="#062042"/>
    <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#4ade80">&#x25CF; Zero Vulnerabilities</text>
  </g>

  <!-- Bottom Tagline Pill -->
  <g transform="translate(240, 440)">
    <rect width="320" height="42" rx="21" fill="#061f3d" stroke="#BE8C33" stroke-width="1"/>
    <text x="160" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F2D184">AR Webcrafts &#8212; High-Performance Digital Solutions</text>
  </g>
</svg>
